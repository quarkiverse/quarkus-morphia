#quarkus.log.category."dev.morphia".level=DEBUG
quarkus.log.category."org.mongodb".level=ERROR
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.alternate.connection-string=mongodb://localhost:27017
quarkus.mongodb.critter.connection-string=mongodb://localhost:27017

quarkus.morphia.database=morphia-int-test
quarkus.morphia.packages=io.quarkiverse.morphia.it.models
quarkus.morphia.apply-caps=true
quarkus.morphia.apply-indexes=true
quarkus.morphia.apply-document-validations=true

quarkus.morphia.alternate.database=morphia-alternate
quarkus.morphia.alternate.packages=io.quarkiverse.morphia.*
quarkus.morphia.alternate.apply-caps=true
quarkus.morphia.alternate.apply-indexes=true
quarkus.morphia.alternate.apply-document-validations=true

quarkus.morphia.critter.database=morphia-critter
quarkus.morphia.critter.auto-import-models=true
